name: GT7 reminders

on:
  schedule:
    - cron: "0 23 * * *"   # 07:00 Perth
    - cron: "0 11 * * *"   # 19:00 Perth (also picks up button presses)
  push:
    paths: ["campaigns.json"]   # run right away when new dates are added
  workflow_dispatch:
    inputs:
      test:
        description: "只發一則測試訊息"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gt7-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send reminders
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test }}
        run: python remind.py

      - name: Save state
        if: always()
        run: |
          if git diff --quiet state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update reminder state"
          git pull --rebase
          git push
